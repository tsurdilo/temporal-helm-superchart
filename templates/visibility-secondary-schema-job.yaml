{{- if and .Values.dualVisibility.enabled .Values.dualVisibility.schemaHookEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-visibility-secondary-schema
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgresql-visibility-secondary
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Release.Name }}-postgresql-visibility-secondary -U temporal -d temporal_visibility_secondary -q; do
                echo "Waiting for postgresql-visibility-secondary..."
                sleep 2
              done
          env:
            - name: PGPASSWORD
              value: temporal
        - name: setup-schema
          image: temporalio/admin-tools:{{ .Chart.AppVersion }}
          command: ["sh", "-c"]
          args:
            - >
              temporal-sql-tool setup-schema -v 0.0 &&
              temporal-sql-tool update-schema --schema-dir /etc/temporal/schema/postgresql/v12/visibility/versioned
          env:
            - name: SQL_PLUGIN
              value: postgres12
            - name: SQL_HOST
              value: {{ .Release.Name }}-postgresql-visibility-secondary
            - name: SQL_PORT
              value: "5432"
            - name: SQL_DATABASE
              value: temporal_visibility_secondary
            - name: SQL_USER
              value: temporal
            - name: SQL_PASSWORD
              value: temporal
      containers:
        - name: done
          image: temporalio/admin-tools:{{ .Chart.AppVersion }}
          command: ["sh", "-c", "echo 'visibility-secondary schema applied'"]
{{- end }}
