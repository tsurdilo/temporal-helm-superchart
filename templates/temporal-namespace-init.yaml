{{- if and .Values.temporal.enabled (ne .Values.namespaceInit.enabled false) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-namespace-init
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-timeout": "600"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: namespace-init
          image: temporalio/admin-tools:1.31.0
          command:
            - /bin/sh
            - -c
            - |
              {{- if .Values.auth.enabled }}
              # Auth is enabled on the public frontend — use internal-frontend instead.
              # internal-frontend is reachable only within the cluster and bypasses the
              # JWT authorizer by design (config.go: "recommended for deployments using
              # Authorizer+ClaimMapper"). No token needed.
              FRONTEND="{{ .Release.Name }}-internal-frontend:7236"
              {{- else }}
              FRONTEND="{{ .Release.Name }}-frontend:7233"
              {{- end }}
              until temporal --address "${FRONTEND}" operator namespace list > /dev/null 2>&1; do
                echo "Waiting for frontend..."; sleep 3;
              done
              temporal --address "${FRONTEND}" operator namespace create -n default \
                --description "Default namespace" || echo "Namespace already exists, skipping."
              {{- if .Values.minio.enabled }}
              temporal --address "${FRONTEND}" operator namespace update default \
                --history-archival-state enabled \
                --history-uri "minio://temporal-history/history" \
                --visibility-archival-state enabled \
                --visibility-uri "minio://temporal-visibility/visibility" \
                && echo "Archival enabled on default namespace." \
                || echo "Warning: could not enable archival on default namespace."
              {{- end }}
{{- end }}
