{{- if .Values.minio.enabled }}
# MinIO — object storage for workflow and visibility archival
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-minio
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-minio
    spec:
      containers:
        - name: minio
          # Bitnami's own start script runs the server, so no args here. Only the API (9000) is
          # exposed: this build does not serve the MinIO web console.
          image: {{ .Values.minio.image }}
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
            # Storage is an emptyDir, so every new pod starts empty. The Bitnami start script creates
            # these buckets on every start; the init job below cannot, because it runs once per
            # install or upgrade and can reach the old pod while a new one is rolling out.
            - name: MINIO_DEFAULT_BUCKETS
              value: {{ join "," .Values.minio.buckets | quote }}
          ports:
            - containerPort: 9000
              name: api
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
      volumes:
        - name: data
          emptyDir: {}
---
# ClusterIP for Temporal server → MinIO API (port 9000)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
# Init job — creates the required buckets on first install
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-minio-init
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.clientImage }}
          env:
            # The image runs as uid 1001 with HOME=/, so mc cannot write its default config dir.
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://{{ .Release.Name }}-minio:9000 \
                {{ .Values.minio.rootUser }} {{ .Values.minio.rootPassword }} 2>/dev/null; do
                echo "waiting for MinIO..."; sleep 3;
              done
              {{- range .Values.minio.buckets }}
              mc mb --ignore-existing local/{{ . }}
              {{- end }}
              echo "buckets ready"
{{- end }}
