apiVersion: v2
name: temporal-stack
description: >
  Self-contained Temporal Server cluster with full observability stack.
  Includes PostgreSQL, Prometheus, Grafana, Loki, Promtail, MinIO, and a
  custom Temporal server with MinIO archival and ConfigMap-based dynamic config.
type: application
version: 0.1.0
appVersion: "1.31.0"

dependencies:
  # Temporal Server
  - name: temporal
    version: "1.2.0"
    repository: "https://go.temporal.io/helm-charts"
    condition: temporal.enabled

  # PostgreSQL — main store + visibility store
  - name: postgresql
    version: "18.7.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  # Prometheus + Grafana + Alertmanager
  - name: kube-prometheus-stack
    version: "86.2.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled

  # Log aggregation
  - name: loki
    version: "7.0.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled

  # Log shipping agent (runs on every node, ships pod logs to Loki)
  - name: promtail
    version: "6.17.1"
    repository: "https://grafana.github.io/helm-charts"
    condition: promtail.enabled

  # MinIO is deployed via templates/minio.yaml using the official minio/minio image
  # (not a subchart — the Bitnami MinIO chart image is not available on Docker Hub)
