  # =============================================================================
# Temporal Stack — values.yaml
# =============================================================================
# All subchart values are namespaced under their chart name.
# Set <subchart>.enabled: false to disable any component.
# =============================================================================

# -----------------------------------------------------------------------------
# PostgreSQL — three isolated instances
# postgresql-main:          temporal DB (workflow state, history, task queues)
# postgresql-visibility:    temporal_visibility DB (primary visibility store)
# postgresql-visibility-secondary: temporal_visibility_secondary DB (secondary visibility store)
#                           Only deployed when dualVisibility.enabled: true
# -----------------------------------------------------------------------------
postgresql-main:
  auth:
    username: temporal
    password: temporal
    database: temporal

postgresql-visibility:
  auth:
    username: temporal
    password: temporal
    database: temporal_visibility

postgresql-visibility-secondary:
  auth:
    username: temporal
    password: temporal
    database: temporal_visibility_secondary

# -----------------------------------------------------------------------------
# Dual Visibility
# -----------------------------------------------------------------------------
dualVisibility:
  enabled: true
  schemaHookEnabled: true

# -----------------------------------------------------------------------------
# Temporal Server
# -----------------------------------------------------------------------------
temporal:
  enabled: true

  server:
    replicaCount: 1

    image:
      repository: temporal-custom-server
      tag: latest
      pullPolicy: Never


    frontend:
      replicaCount: 2
      service:
        type: NodePort
        port: 7233
        nodePort: 7233

    history:
      replicaCount: 2

    matching:
      replicaCount: 2

    worker:
      replicaCount: 1

    internal-frontend:
      enabled: true
      replicaCount: 1

    metrics:
      serviceMonitor:
        enabled: true
        interval: 30s
        metricRelabelings:
          - sourceLabels: [exported_namespace]
            targetLabel: namespace
            action: replace
          - regex: exported_namespace
            action: labeldrop

    # Dynamic config via ConfigMap (managed by temporal-configmap-dynconfig)
    dynamicConfig: {}

    archival:
      history:
        state: "enabled"
        enableRead: true
        provider:
          customStores:
            minio:
              endpoint: "http://temporal-stack-minio:9000"
              region: "us-east-1"
              accessKeyID: "minioadmin"
              secretAccessKey: "minioadmin"
      visibility:
        state: "enabled"
        enableRead: true
        provider:
          customStores:
            minio:
              endpoint: "http://temporal-stack-minio:9000"
              region: "us-east-1"
              accessKeyID: "minioadmin"
              secretAccessKey: "minioadmin"

    namespaceDefaults:
      archival:
        history:
          state: "enabled"
          URI: "minio://temporal-history/history"
        visibility:
          state: "enabled"
          URI: "minio://temporal-visibility/visibility"

    config:
      persistence:
        defaultStore: default
        visibilityStore: visibility
        # secondaryVisibilityStore is NOT set here — it is injected by install.sh via
        # --set temporal.server.config.persistence.secondaryVisibilityStore=visibility-secondary
        # when dualVisibility.enabled: true. Setting it unconditionally here would cause
        # the schema job to fail when postgresql-visibility-secondary is not deployed.
        numHistoryShards: 2048
        datastores:
          "default":
            sql:
              pluginName: postgres12
              connectAddr: "temporal-stack-postgresql-main:5432"
              connectProtocol: "tcp"
              databaseName: temporal
              user: temporal
              password: temporal
              maxConns: 20
              maxIdleConns: 20
              maxConnLifetime: "1h"
              manageSchema: true
          "visibility":
            sql:
              pluginName: postgres12
              connectAddr: "temporal-stack-postgresql-visibility:5432"
              connectProtocol: "tcp"
              databaseName: temporal_visibility
              user: temporal
              password: temporal
              maxConns: 20
              maxIdleConns: 20
              maxConnLifetime: "1h"
              manageSchema: true
          "visibility-secondary":
            sql:
              pluginName: postgres12
              connectAddr: "temporal-stack-postgresql-visibility-secondary:5432"
              connectProtocol: "tcp"
              databaseName: temporal_visibility_secondary
              user: temporal
              password: temporal
              maxConns: 20
              maxIdleConns: 20
              maxConnLifetime: "1h"
              manageSchema: false
              createDatabase: false

  web:
    enabled: true
    replicaCount: 1
    service:
      type: NodePort
      port: 8080
      nodePort: 30080
    # Auth env vars — populated by templates/auth.yaml when auth.enabled: true
    # Do not set these manually; they are managed by the auth template.
    additionalEnv: []
    additionalEnvSecretName: ""

  serviceAccount:
    create: true
    name: "temporal-stack-server"

  admintools:
    enabled: true


# -----------------------------------------------------------------------------
# kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
# -----------------------------------------------------------------------------
kube-prometheus-stack:
  enabled: true

  prometheus:
    service:
      type: NodePort
      nodePort: 30090
    prometheusSpec:
      # Pick up ServiceMonitors and PrometheusRules from all namespaces
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleNamespaceSelectorNilUsesHelmValues: false

  grafana:
    enabled: true
    adminPassword: admin
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://temporal-stack-loki:3100
        access: proxy
        isDefault: false
    service:
      type: NodePort
      port: 80
      nodePort: 30300

  alertmanager:
    enabled: true

  nodeExporter:
    enabled: false

  prometheus-node-exporter:
    enabled: false

# -----------------------------------------------------------------------------
# Loki
# -----------------------------------------------------------------------------
loki:
  enabled: true
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
  singleBinary:
    replicas: 1
  # Disable components not needed in single-binary mode
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  # Disable caches — not needed locally, too memory-hungry
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

# -----------------------------------------------------------------------------
# Promtail
# -----------------------------------------------------------------------------
promtail:
  enabled: true
  config:
    clients:
      - url: http://temporal-stack-loki:3100/loki/api/v1/push

# -----------------------------------------------------------------------------
# Namespace init job
# Set to false to suppress the post-install/post-upgrade namespace-init hook.
# Used by upgrade-test.sh Phase A (v1.30.0 install) where the server binary is
# v1.31.0 and won't start against a v1.18 schema — the hook would loop forever.
# The hook fires correctly in Phase B after schema migration and binary upgrade.
# -----------------------------------------------------------------------------
namespaceInit:
  enabled: true

# MinIO
# -----------------------------------------------------------------------------
minio:
  enabled: true
  image: minio/minio:latest
  rootUser: minioadmin
  rootPassword: minioadmin
  buckets:
    - temporal-history
    - temporal-visibility
  consoleNodePort: 30901

# -----------------------------------------------------------------------------
# Health Poller
# -----------------------------------------------------------------------------
healthPoller:
  enabled: true
  image:
    repository: temporal-health-poller
    tag: latest
    pullPolicy: Never
  frontendAddr: "temporal-stack-frontend:7233"
  pollInterval: "15s"

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
# auth.enabled: true  wires JWT validation into Temporal server and enables
#                     OAuth2 login on the Temporal UI.
#
# Local (Docker Desktop): set dex.enabled: true — a bundled Dex OIDC provider
#   issues JWTs using static users defined below. No external IDP needed.
#
# Production: set dex.enabled: false and supply your IDP's JWKS endpoint and
#   OIDC discovery URL (Okta, Auth0, Keycloak, etc.) via auth.jwt / auth.ui.
# -----------------------------------------------------------------------------
auth:
  enabled: true

  # JWT validation — wired into temporal server global.authorization
  jwt:
    # keySourceURIs: auto-populated from Dex service URL when dex.enabled: true
    # For production (dex.enabled: false) set this to your IDP's JWKS endpoint:
    #   keySourceURIs:
    #     - https://your-okta-domain/oauth2/default/v1/keys
    keySourceURIs: []
    refreshInterval: 1m
    audience: ""
    permissionsClaimName: permissions
    # permissionsRegex: parses permissions claim into namespace+role
    # e.g. "^(?P<role>\\w+):(?P<namespace>\\w+)$" matches "admin:default"
    permissionsRegex: ""

  # Web UI OAuth2 config — wired into temporal.web.additionalEnv
  ui:
    # providerUrl: URL the UI SERVER uses to fetch the OIDC discovery doc at startup.
    # Must be reachable from inside the pod — use the internal K8s service name.
    # The browser redirect URL comes from Dex's issuer (dex.config.issuer) via the
    # discovery doc's authorization_endpoint — set dex.config.issuer to a
    # browser-reachable URL (localhost NodePort for local, public hostname for prod).
    # For production (dex.enabled: false) set to your IDP's OIDC discovery URL.
    providerUrl: ""
    clientId: temporal-ui
    # callbackUrl: must match the redirect URI registered with your IDP
    # For local Docker Desktop: http://<your-static-ip>:30080/auth/sso/callback
    callbackUrl: "http://localhost:30080/auth/sso/callback"
    scopes: "openid,profile,email"
    # Client secret — reference an existing K8s secret (never inline the value)
    # When dex.enabled: true this is auto-created from dex.staticClients[0].secret
    existingSecret: "temporal-dex-client-secret"
    existingSecretKey: "TEMPORAL_AUTH_CLIENT_SECRET"

# -----------------------------------------------------------------------------
# Dex — bundled OIDC identity provider (local only)
# Set dex.enabled: false in production and use your own IDP instead.
# -----------------------------------------------------------------------------
dex:
  enabled: true
  config:
    # Issuer URL must be identical everywhere: browser, UI pod, and Temporal server.
    # It must be a URL reachable from ALL three — the browser, pods inside the
    # cluster, and the Temporal server doing JWKS fetches.
    #
    # Issuer must resolve identically from: browser, UI pod, and Temporal server.
    # host.docker.internal resolves to the host machine from inside pods AND the
    # browser on Docker Desktop. Docker Desktop should add this automatically but
    # sometimes omits it — see README "Prerequisites" for the one-time fix.
    # Production: set dex.enabled: false and use your own IDP with a real hostname.
    issuer: http://host.docker.internal:30556/dex

    storage:
      type: memory

    web:
      http: 0.0.0.0:5556

    oauth2:
      skipApprovalScreen: true
      responseTypes:
        - code
      grantTypes:
        - authorization_code
        - refresh_token
        - "urn:ietf:params:oauth2:grant-type:device_code"

    # Required when staticPasswords is used
    enablePasswordDB: true

    staticClients:
      - id: temporal-ui
        name: Temporal UI
        secret: temporal-ui-secret
        # redirectURIs must include every URL the browser may land on after login.
        # Add your public hostname here if exposing via ingress.
        redirectURIs:
          - http://localhost:30080/auth/sso/callback
      - id: temporal-cli
        name: Temporal CLI/SDK
        # Public PKCE client — no secret. Used by scripts/dex-login.go to get
        # a JWT for CLI and SDK testing without a browser-embedded redirect.
        public: true
        redirectURIs:
          - http://localhost:7788/callback

    staticPasswords:
      - email: admin@temporal.io
        # bcrypt hash of "admin" — change for any non-local deployment
        hash: "$2y$10$3hiEd4su64CbNiBVAnPDouYvwtjPnW7UMUiZiUuiwjnYXcQT060jy"
        username: admin
        userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"

  service:
    type: NodePort
    ports:
      http:
        port: 5556
        nodePort: 30556

# -----------------------------------------------------------------------------
# TLS
# Phase B.1: encrypt the frontend wire (server cert only)
# Phase B.2: add requireClientAuth: true — server demands client cert from workers/CLI
# Phase C:   internode TLS between Temporal services
#
# All disabled by default. Production deployments bring their own certs via K8s Secrets.
# See PLANNING.md "Phase B" for cert generation commands and wiring details.
# -----------------------------------------------------------------------------
tls:
  frontend:
    enabled: false           # Phase B.1: wire frontend TLS (server cert)
    requireClientAuth: false # Phase B.2: enforce client cert from SDK workers + CLI
    # K8s Secret with tls.crt (server cert), tls.key, ca.crt
    # Create with: kubectl create secret generic temporal-frontend-tls \
    #   --from-file=tls.crt=frontend.crt --from-file=tls.key=frontend.key --from-file=ca.crt=ca.crt
    existingSecret: ""
    # DNS SAN in the frontend server cert — must match what clients use as serverName
    # For Docker Desktop local: "temporal-stack-frontend.temporal.svc.cluster.local"
    serverName: ""
  internode:
    enabled: false           # Phase C: encrypt internode service traffic
    existingSecret: ""       # K8s Secret with tls.crt, tls.key, ca.crt
    serverName: ""

# -----------------------------------------------------------------------------
# Global storage class
# Set to "" to use the cluster default (works on Docker Desktop out of the box)
# Override for other environments: e.g. "gp2" on AWS, "pd-standard" on GCP
# -----------------------------------------------------------------------------
global:
  storageClass: ""
